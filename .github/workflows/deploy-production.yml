name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Consente deploy manuale dalla UI GitHub

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.10'

jobs:
  # ============================================================================
  # JOB 1: TEST - Esegue test prima del deploy
  # ============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: mygest_test
          POSTGRES_USER: mygest_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔍 Django System Check
        env:
          DATABASE_URL: postgresql://mygest_user:test_password@localhost:5432/mygest_test
          REDIS_URL: redis://localhost:6379/0
          DEBUG: 'True'
          SECRET_KEY: "github-actions-ci-test-key-not-for-production-use-only-1234567890abcdef"
          ALLOWED_HOSTS: '*'
          DISABLE_DB_POOL: 'True'
        run: |
          python manage.py check
        continue-on-error: false
      
      - name: 🗄️ Run Migrations
        env:
          DATABASE_URL: postgresql://mygest_user:test_password@localhost:5432/mygest_test
          REDIS_URL: redis://localhost:6379/0
          DEBUG: 'True'
          SECRET_KEY: "github-actions-ci-test-key-not-for-production-use-only-1234567890abcdef"
          DISABLE_DB_POOL: 'True'
        run: |
          python manage.py migrate --noinput
      
      - name: 🧪 Run Backend Tests
        env:
          DATABASE_URL: postgresql://mygest_user:test_password@localhost:5432/mygest_test
          REDIS_URL: redis://localhost:6379/0
          DEBUG: 'True'
          SECRET_KEY: "github-actions-ci-test-key-not-for-production-use-only-1234567890abcdef"
          DISABLE_DB_POOL: 'True'
        run: |
          pytest --maxfail=5 --tb=short -v
        continue-on-error: true  # Non blocca il deploy se i test falliscono
  
  # ============================================================================
  # JOB 2: BUILD FRONTEND
  # ============================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci
      
      - name: 🔍 Lint Frontend
        working-directory: frontend
        run: npm run lint
        continue-on-error: true
      
      - name: 🏗️ Build Frontend
        working-directory: frontend
        run: npm run build
      
      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1
  
  # ============================================================================
  # JOB 3: DEPLOY - Esegue deploy su VPS
  # ============================================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test, build-frontend]  # Attende completamento test e build
    environment: production  # Usa environment "production" per secrets
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 📥 Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
      
      - name: 🔑 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write SSH key preserving exact format
          cat > ~/.ssh/deploy_key << 'EOF'
          ${{ secrets.SSH_KEY }}
          EOF
          
          # Ensure proper permissions and newline at end
          chmod 600 ~/.ssh/deploy_key
          
          # Validate key format
          echo "Validating SSH key format..."
          ssh-keygen -l -f ~/.ssh/deploy_key
          
          # Add host to known_hosts
          echo "Adding ${{ secrets.SSH_HOST }} to known_hosts..."
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          
          echo "✅ SSH key setup completed"
      
      - name: 🚀 Deploy to VPS via SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -p ${{ secrets.SSH_PORT || 22 }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -ex  # Enable debugging and exit on error
            echo "🚀 Starting deployment..."
            cd /srv/mygest/app
            
            # Pull latest code
            echo "📥 Pulling latest code..."
            git fetch --all
            git reset --hard origin/main
            
            # Activate venv and install deps
            echo "📦 Installing Python dependencies..."
            source /srv/mygest/venv/bin/activate || { echo "Failed to activate venv"; exit 1; }
            pip install -q --upgrade pip || { echo "Failed to upgrade pip"; exit 1; }
            pip install -q -r requirements.txt || { echo "Failed to install requirements"; exit 1; }
            
            # Run deploy script with --force if service is not active
            echo "🔧 Running deploy script..."
            if ! systemctl is-active --quiet gunicorn_mygest; then
              echo "⚠️  Service not active, using --force --skip-backup flags"
              ./scripts/deploy.sh --force --skip-backup || { echo "Deploy script failed"; exit 1; }
            else
              ./scripts/deploy.sh || { echo "Deploy script failed"; exit 1; }
            fi
            
            echo "✅ Deployment completed!"
          ENDSSH
      
      - name: 🏥 Health Check
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -p ${{ secrets.SSH_PORT || 22 }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            
            echo "🔍 Checking service status..."
            systemctl status gunicorn_mygest --no-pager || true
            
            echo ""
            echo "🔍 Checking logs (last 20 lines)..."
            sudo journalctl -u gunicorn_mygest -n 20 --no-pager || true
            
            echo ""
            echo "🔍 Checking if port 8000 is listening..."
            sudo netstat -tlnp | grep :8000 || sudo ss -tlnp | grep :8000 || echo "Port 8000 not listening"
            
            echo ""
            echo "⏳ Waiting for service to be ready..."
            sleep 5
            
            # Health check con retry
            for i in {1..5}; do
              if curl -sf --max-time 10 http://localhost:8000/api/v1/health/ > /dev/null; then
                echo "✅ Health check passed!"
                exit 0
              fi
              echo "⏳ Retry $i/5..."
              sleep 3
            done
            
            echo "❌ Health check failed after 5 attempts"
            echo ""
            echo "🔍 Final service status:"
            systemctl status gunicorn_mygest --no-pager || true
            echo ""
            echo "🔍 Last 50 log lines:"
            sudo journalctl -u gunicorn_mygest -n 50 --no-pager || true
            exit 1
          ENDSSH
      
      - name: 📊 Deployment Summary
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
      
      - name: 🔔 Notify on Failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check logs for details." >> $GITHUB_STEP_SUMMARY
          echo "Rollback may be required." >> $GITHUB_STEP_SUMMARY
